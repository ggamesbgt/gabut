<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hantu Kabur — Gabut</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101329;color:#fff3e9;font:16px system-ui}main{max-width:790px;margin:auto;padding:clamp(12px,4vw,28px)}a{color:#acffe6}header{display:flex;justify-content:space-between;align-items:end;gap:8px;margin:12px 0}h1{font-size:clamp(27px,7vw,58px);letter-spacing:-.065em;margin:0;line-height:1}output{font-size:14px;color:#acffe6;text-align:right}.arena{position:relative}.arena canvas{display:block;width:100%;aspect-ratio:13/9;border:1px solid #706890;border-radius:14px;background:#10152f;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-content:center;text-align:center;border-radius:14px;background:#19142bd1;pointer-events:none;padding:15px}.overlay[hidden],[hidden]{display:none}h2{font-size:clamp(22px,5vw,40px);margin:0}footer{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}button{font:inherit;color:inherit;background:#332c51;border:1px solid #8b7daa;border-radius:8px;padding:9px 12px;touch-action:none}button[aria-pressed=true]{background:#acffe6;color:#18312c}button:disabled{opacity:.45}button:focus-visible,canvas:focus-visible{outline:2px solid #acffe6;outline-offset:2px}p{color:#d5c7e0;margin:8px 0;font-size:14px}
</style>
<main>
<a href="../index.html">← Kembali ke Gabut</a>
<header><h1>Hantu Kabur</h1><output id="stats"></output></header>
<div class="arena"><canvas width="624" height="432" tabindex="0" aria-label="Labirin Hantu Kabur"></canvas>
<div class="overlay" id="overlay" role="status"><div><h2 id="status"></h2><p id="detail"></p></div></div></div>
<footer>
<button id="up" aria-label="Atas">↑</button><button id="left" aria-label="Kiri">←</button><button id="down" aria-label="Bawah">↓</button><button id="right" aria-label="Kanan">→</button>
<button id="play">Mulai</button><button id="next" hidden>Level berikutnya</button><button id="ai" aria-pressed="false">Jalankan AI</button><button id="pause">Jeda</button><button id="sound" aria-pressed="false">Bunyi usil: OFF</button>
</footer>
<p>Pilih arah dengan tombol panah, WASD, atau geser arena. Hantu terus bergerak sampai menemui dinding. Kumpulkan lentera besar, lalu kabur lewat portal sebelum disergap Penjaga Pijar.</p>
</main>
<script src="annoying-sound.js"></script>
<script>
'use strict';
const get=id=>document.getElementById(id);
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const sound=typeof bindAnnoyingSound==='function'?bindAnnoyingSound(get('sound')):()=>{};
const COLS=13,ROWS=9,TILE=48,CELLS=COLS*ROWS;
const moves=[[0,0],[-1,0],[1,0],[0,-1],[0,1]];
const keys={ArrowLeft:1,ArrowRight:2,ArrowUp:3,ArrowDown:4,KeyA:1,KeyD:2,KeyW:3,KeyS:4};
const cell=(x,y)=>y*COLS+x;
function makeLevel(name,frames,interval,exit,tokens,gates){
  const walls=new Set();
  for(const [x,...gaps] of gates)for(let y=0;y<ROWS;y++)if(!gaps.includes(y))walls.add(cell(x,y));
  const reserved=new Set([cell(...exit),cell(0,4),cell(12,8),...tokens.map(([x,y])=>cell(x,y))]);
  const islands=[[1,2],[2,2],[4,3],[5,3],[7,5],[8,5],[10,6],[11,6],[1,6],[4,5],[8,2],[11,3]];
  for(const [x,y] of islands){
    const tile=cell(x,y);
    if(!reserved.has(tile)&&!gates.some(([column])=>column===x))walls.add(tile);
  }
  const graph=Array.from({length:CELLS},(_,i)=>{
    const x=i%COLS,y=Math.floor(i/COLS);
    return moves.map(([dx,dy])=>{
      const nx=x+dx,ny=y+dy,to=cell(nx,ny);
      return nx<0||nx>=COLS||ny<0||ny>=ROWS||walls.has(to)?i:to;
    });
  });
  const distances=new Map();
  function toward(from,to){
    if(!distances.has(to)){
      const dist=new Int16Array(CELLS).fill(-1),queue=[to];dist[to]=0;
      for(let i=0;i<queue.length;i++)for(const n of graph[queue[i]]){
        if(dist[n]===-1){dist[n]=dist[queue[i]]+1;queue.push(n);}
      }
      distances.set(to,dist);
    }
    const dist=distances.get(to);
    return graph[from].reduce((best,n)=>dist[n]>=0&&dist[n]<dist[best]?n:best,from);
  }
  return {name,frames,interval,goal:cell(...exit),walls,graph,toward,
    tokens:new Map(tokens.map(([x,y],i)=>[cell(x,y),1<<i])),all:(1<<tokens.length)-1};
}
const levels=[
  makeLevel('Serambi Gelap',13,4,[12,4],[[4,2],[9,6]],[[6,1,4,7]]),
  makeLevel('Pintu Samping',12,4,[12,2],[[4,6],[8,1],[11,5]],[[3,2,6],[7,1,4,7],[10,2,5,7]]),
  makeLevel('Lorong Sumbu',12,3,[12,6],[[2,0],[6,7],[10,1]],[[4,1,4,7],[8,0,3,7]]),
  makeLevel('Pusaran Cahaya',11,3,[12,3],[[3,7],[7,1],[10,6],[11,0]],[[2,1,4,7],[5,2,5,7],[9,1,4,6]]),
  makeLevel('Penjaga Siaga',10,2,[12,7],[[2,7],[6,1],[8,7],[11,2]],[[3,1,4,7],[7,1,4,7],[10,2,4,7]]),
  makeLevel('Kabur Saat Fajar',9,2,[12,4],[[2,1],[5,7],[8,0],[9,7],[11,1]],[[3,1,5,7],[6,0,4,7],[10,1,4,7]])
];
const startGhost=cell(0,4),startKeeper=cell(12,8),held=new Map();
const active=()=>levels[level];
let level=0,state='ready',ai=false,node,attempts=0,clock=0,delay=0,route,routeIndex,direction=0,buffered=0,prior,keeperAngle=0,trail,score=0,levelScore=0;
function transition(stage,from,move){
  const ghost=stage.graph[from.ghost][move];
  if(ghost===from.keeper)return null;
  const phase=(from.phase+1)%stage.interval;
  const keeper=phase?from.keeper:stage.toward(from.keeper,ghost);
  if(keeper===ghost)return null;
  return {ghost,keeper,phase,bits:from.bits|(stage.tokens.get(ghost)||0)};
}
function arrived(stage,position){return position.ghost===stage.goal&&position.bits===stage.all;}
function solve(stage,start){
  const queue=[{...start,parent:-1,move:0}],visited=new Set();
  for(let i=0;i<queue.length&&i<120000;i++)for(let move=0;move<moves.length;move++){
    const next=transition(stage,queue[i],move);
    if(!next)continue;
    if(arrived(stage,next)){
      const result=[move];
      for(let j=i;queue[j].parent>=0;j=queue[j].parent)result.push(queue[j].move);
      return result.reverse();
    }
    const key=((next.ghost*CELLS+next.keeper)*stage.interval+next.phase)*(stage.all+1)+next.bits;
    if(!visited.has(key)){visited.add(key);queue.push({...next,parent:i,move});}
  }
  return null;
}
function start(index,mode,initial='playing'){
  level=index;ai=mode;state=initial;clock=delay=routeIndex=direction=buffered=0;held.clear();
  node={ghost:startGhost,keeper:startKeeper,phase:0,bits:0};
  prior=node;keeperAngle=Math.PI;trail=new Set([startGhost]);levelScore=0;
  route=ai?solve(active(),node):null;
  if(ai&&!route)ai=false;
  refresh();
}
function updateStats(){
  const stage=active(), count=[...stage.tokens.values()].filter(bit=>node.bits&bit).length;
  get('stats').textContent='Level '+(level+1)+' / '+levels.length+' · Lentera '+count+'/'+stage.tokens.size+' · Skor '+(score+levelScore)+' · Tertangkap '+attempts;
}
function refresh(){
  updateStats();
  const stage=active();
  get('overlay').hidden=state==='playing';
  get('status').textContent={ready:stage.name,paused:'Dijeda',lost:'Hantu tertangkap!',clear:'Berhasil kabur!',won:'Lolos sampai fajar!'}[state]||'';
  get('detail').textContent={ready:'Pilih Mulai atau Jalankan AI.',lost:'Tekan Ulangi level untuk mencoba lagi.',
    clear:ai?'AI lanjut otomatis.':'Pintu berikutnya sudah menunggu.',won:'Semua '+levels.length+' labirin selesai.'}[state]||'';
  get('play').textContent=state==='ready'?'Mulai':state==='won'?'Main lagi':'Ulangi level';
  get('next').hidden=state!=='clear';
  get('ai').textContent=ai?'Ambil alih':'Jalankan AI';
  get('ai').setAttribute('aria-pressed',String(ai));
  get('pause').disabled=state!=='playing'&&state!=='paused';
  get('pause').textContent=state==='paused'?'Lanjutkan':'Jeda';
}
function next(){if(state==='clear'){score+=levelScore;start(level+1,ai);}}
function restart(mode){if(state==='won'){attempts=score=0;start(0,mode);}else start(level,mode);}
function manualMove(stage){
  const row=stage.graph[node.ghost];
  const requested=[...held.values()].at(-1)||buffered;
  if(requested&&row[requested]!==node.ghost){direction=requested;buffered=0;}
  return direction;
}
function tick(){
  if(state==='clear'&&ai&&--delay<=0){next();return;}
  if(state!=='playing')return;
  const stage=active();
  if(++clock<stage.frames)return;
  clock=0;
  const position=transition(stage,node,ai?(route[routeIndex++]??0):manualMove(stage));
  if(!position){
    ai=false;state='lost';attempts++;held.clear();sound('miss');refresh();return;
  }
  const changed=position.bits!==node.bits;
  prior=node;node=position;
  if(prior.keeper!==node.keeper){
    const [px,py]=xy(prior.keeper),[x,y]=xy(node.keeper);
    keeperAngle=Math.atan2(y-py,x-px);
  }
  if(!trail.has(node.ghost)){trail.add(node.ghost);levelScore+=10;}
  if(changed){levelScore+=100;sound('point');}
  updateStats();
  if(arrived(stage,node)){
    state=level+1===levels.length?'won':'clear';delay=55;held.clear();
    if(state==='won')ai=false;
    sound('win');refresh();
  }
}
function xy(id){return [(id%COLS+.5)*TILE,(Math.floor(id/COLS)+.5)*TILE];}
function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,2*Math.PI);ctx.fillStyle=color;ctx.fill();}
function between(from,to){
  const [x,y]=xy(from),[tx,ty]=xy(to);
  const f=state==='playing'||state==='paused'?clock/active().frames:1;
  return [x+(tx-x)*f,y+(ty-y)*f];
}
function draw(){
  const stage=active();
  for(let i=0;i<CELLS;i++){
    const [x,y]=xy(i),wall=stage.walls.has(i),top=y-TILE/2,left=x-TILE/2;
    ctx.fillStyle=wall?'#202956':'#10152f';ctx.fillRect(left,top,TILE,TILE);
    if(wall){
      ctx.fillStyle='#596fe8';
      if(i%COLS===0||!stage.walls.has(i-1))ctx.fillRect(left,top,3,TILE);
      if(i%COLS===COLS-1||!stage.walls.has(i+1))ctx.fillRect(left+TILE-3,top,3,TILE);
      if(i<COLS||!stage.walls.has(i-COLS))ctx.fillRect(left,top,TILE,3);
      if(i>=CELLS-COLS||!stage.walls.has(i+COLS))ctx.fillRect(left,top+TILE-3,TILE,3);
    }else if(!trail.has(i)&&!stage.tokens.has(i)&&i!==stage.goal){
      circle(x,y,2,'#e7b987');
    }
  }
  const [gx,gy]=xy(stage.goal);
  ctx.strokeStyle=node.bits===stage.all?'#acffe6':'#867a9a';ctx.lineWidth=3;
  ctx.strokeRect(gx-15,gy-17,30,34);
  for(const [id,bit] of stage.tokens){
    if(node.bits&bit)continue;
    const [x,y]=xy(id);circle(x,y,11,'#ffdb9250');circle(x,y,6,'#ffd98b');
  }
  const [kx,ky]=between(prior.keeper,node.keeper);
  const jaw=5+3*Math.sin(clock*.66);
  ctx.save();ctx.translate(kx,ky);ctx.rotate(keeperAngle);
  ctx.fillStyle='#ffba64';ctx.beginPath();
  ctx.moveTo(-16,0);ctx.lineTo(-7,-14);ctx.lineTo(8,-14);
  ctx.lineTo(17,-jaw-2);ctx.lineTo(3,0);ctx.lineTo(17,jaw+2);
  ctx.lineTo(8,14);ctx.lineTo(-7,14);ctx.closePath();ctx.fill();
  circle(-3,-7,3,'#502f50');circle(-3,7,3,'#502f50');ctx.restore();
  if(state!=='lost'){
    const [x,y]=between(prior.ghost,node.ghost);
    circle(x,y-3,13,'#acffe6');
    ctx.fillStyle='#acffe6';ctx.fillRect(x-13,y-3,26,13);
    circle(x-5,y-3,2,'#2d3751');circle(x+5,y-3,2,'#2d3751');
    circle(x-8,y+12,3,'#acffe6');circle(x+8,y+12,3,'#acffe6');
  }
}
function takeOver(){if(ai){ai=false;refresh();}}
function steer(id,move){takeOver();buffered=move;held.set(id,move);}
for(const [name,move] of [['left',1],['right',2],['up',3],['down',4]]){
  const button=get(name);
  button.addEventListener('pointerdown',e=>{button.setPointerCapture(e.pointerId);steer(e.pointerId,move);});
  button.addEventListener('lostpointercapture',e=>held.delete(e.pointerId));
}
let swipeOrigin;
canvas.addEventListener('pointerdown',e=>{
  if(state!=='playing')return;
  canvas.setPointerCapture(e.pointerId);swipeOrigin={id:e.pointerId,x:e.clientX,y:e.clientY};
});
canvas.addEventListener('pointerup',e=>{
  if(swipeOrigin?.id!==e.pointerId)return;
  const dx=e.clientX-swipeOrigin.x,dy=e.clientY-swipeOrigin.y;
  swipeOrigin=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<12)return;
  takeOver();buffered=Math.abs(dx)>Math.abs(dy)?(dx<0?1:2):(dy<0?3:4);
});
canvas.addEventListener('lostpointercapture',()=>{swipeOrigin=null;});
document.addEventListener('keydown',e=>{if(keys[e.code]){e.preventDefault();if(!e.repeat)steer(e.code,keys[e.code]);}});
document.addEventListener('keyup',e=>held.delete(e.code));
window.addEventListener('blur',()=>{held.clear();buffered=0;if(state==='playing'){state='paused';refresh();}});
get('play').onclick=()=>{restart(false);canvas.focus();};
get('next').onclick=()=>{next();canvas.focus();};
get('ai').onclick=()=>{if(ai)takeOver();else if(state==='clear'){ai=true;next();}else restart(true);canvas.focus();};
get('pause').onclick=()=>{state=state==='paused'?'playing':'paused';held.clear();buffered=0;refresh();if(state==='playing')canvas.focus();};
let previous,elapsed=0;
function frame(now){
  elapsed+=Math.min(65,now-(previous??now));previous=now;
  while(elapsed>=1000/60){tick();elapsed-=1000/60;}
  draw();requestAnimationFrame(frame);
}
start(0,false,'ready');requestAnimationFrame(frame);
</script>
</html>
