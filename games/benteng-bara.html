<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benteng Bara — Gabut</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171418;color:#fff1dc;font:16px system-ui}main{max-width:850px;margin:auto;padding:clamp(12px,4vw,32px)}a{color:#ffc387}h1{font-size:clamp(32px,7vw,60px);letter-spacing:-.06em;margin:8px 0 12px}.meters{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:9px}.meters div{display:grid;gap:4px}.meters label{font-size:14px}progress{width:100%;height:10px;accent-color:#ff765a}#stamina{accent-color:#b9d980}canvas{display:block;width:100%;aspect-ratio:2/1;background:#201720;border:1px solid #725347;border-radius:16px}footer{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}button{background:#392826;color:inherit;border:1px solid #8e6650;border-radius:9px;padding:8px 12px;touch-action:none;font:inherit}button[aria-pressed=true]{background:#f6b87b;color:#2f1711}button:focus-visible,canvas:focus-visible{outline:2px solid #ffc387;outline-offset:3px}p{margin:9px 0;color:#e0c2ab;font-size:14px}#status{min-height:1.45em;color:#ffd49f;font-weight:650}
</style>
<main>
<a href="../index.html">← Kembali ke Gabut</a>
<h1>Benteng Bara</h1>
<p id="level"></p>
<div class="meters">
<div><label for="life">Nyawa ksatria</label><progress id="life" max="100" value="100"></progress><label for="stamina">Stamina</label><progress id="stamina" max="100" value="100"></progress></div>
<div><label id="boss-name" for="boss">Penjaga Tungku</label><progress id="boss" max="150" value="150"></progress></div>
</div>
<canvas width="800" height="400" tabindex="0" aria-label="Arena pertarungan Benteng Bara"></canvas>
<footer>
<button id="left" aria-label="Gerak kiri">←</button><button id="right" aria-label="Gerak kanan">→</button>
<button id="attack">Serang</button><button id="dodge">Dodge</button><button id="heal">Pulihkan (2)</button>
<button id="ai" aria-pressed="false">Jalankan AI</button><button id="next" hidden>Level berikutnya</button><button id="retry" hidden>Ulangi level</button><button id="restart">Mulai dari awal</button><button id="sound" aria-pressed="false">Bunyi usil: OFF</button>
</footer>
<p>← / → bergerak · Z serang · X dodge · C pulihkan nyawa. Di HP, gunakan tombol di bawah arena.</p>
<p>Waspadai garis merah. Hindari serangan, lalu balas saat bos sedang pulih. Nyawa, stamina, dan ramuan dipulihkan saat pindah level.</p>
<p id="status" role="status"></p>
</main>
<script src="annoying-sound.js"></script>
<script>
'use strict';
const get=id=>document.getElementById(id);
const canvas=document.querySelector('canvas');
const ctx=canvas.getContext('2d');
const sound=typeof bindAnnoyingSound==='function'?bindAnnoyingSound(get('sound')):()=>{};
const FLOOR=320, SWORD=82, MIN=40, MAX=760;
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
const held=new Map();
const levels=[
  {name:'Penjaga Tungku',hp:150,reach:121,height:79,armor:'#713c3d',damage:27,speed:2.1,windup:41,recovery:62,slam:false},
  {name:'Ksatria Abu',hp:175,reach:137,height:92,armor:'#536571',damage:30,speed:2.6,windup:35,recovery:65,slam:false},
  {name:'Giant Bara',hp:225,reach:150,height:145,armor:'#924a36',damage:38,speed:2.1,windup:48,recovery:84,slam:true}
];
const player={}, boss={};
let levelIndex=0, intermission=0;
const level=()=>levels[levelIndex];
let ai=false, outcome='', flash=0;
function status(message) { if(get('status').textContent!==message) get('status').textContent=message; }
function setAI(enabled) {
  ai=enabled; held.clear();
  get('ai').textContent=ai?'Hentikan AI':'Jalankan AI';
  get('ai').setAttribute('aria-pressed',String(ai));
}
function meters() {
  get('life').value=player.hp;
  get('stamina').value=player.stamina;
  get('boss').value=boss.hp;
  get('heal').disabled=Boolean(outcome)||!player.tonics;
  get('heal').textContent='Pulihkan ('+player.tonics+')';
}
function reset() {
  setAI(false);
  startLevel(0);
}
function startLevel(index) {
  levelIndex=index; intermission=0; outcome=''; flash=0; held.clear();
  const stage=level();
  get('level').textContent='Level '+(index+1)+' / '+levels.length+' · '+stage.name;
  get('boss-name').textContent=stage.name;
  get('boss').max=stage.hp;
  get('next').hidden=true;
  get('retry').hidden=true;
  Object.assign(player,{x:204,hp:100,stamina:100,tonics:2,timer:0,action:'',roll:1});
  Object.assign(boss,{x:589,hp:stage.hp,phase:'approach',timer:0,face:-1});
  meters(); status('Dekati '+stage.name+'.');
}
const separation=()=>Math.abs(boss.x-player.x);
const toward=()=>Math.sign(boss.x-player.x)||1;
function act(type, direction) {
  if(outcome||player.timer) return;
  const cost={attack:24,dodge:28,heal:0}[type];
  if(player.stamina<cost||(type==='heal'&&(!player.tonics||player.hp>=100))) return;
  player.action=type; player.stamina-=cost;
  player.timer={attack:29,dodge:18,heal:38}[type];
  player.roll=direction||-toward();
  if(type==='heal') player.tonics--;
  sound('move');
}
function finish(result) {
  if(result==='win' && levelIndex<levels.length-1) {
    outcome='clear'; intermission=85;
    get('next').hidden=false;
    sound('win');
    status('Level selesai. Bersiap untuk bos berikutnya.');
    return;
  }
  outcome=result; setAI(false);
  get('retry').hidden=result!=='loss';
  sound(result==='win'?'win':'miss');
  status(result==='win'?'Giant Bara tumbang. Benteng direbut!':'Ksatria tumbang. Tekan Ulangi level untuk mencoba lagi.');
}
function pilot() {
  if (player.timer) return 0;
  const stage=level();
  const dist=separation();
  if(boss.phase==='windup') {
    if(boss.timer<=8 && dist<stage.reach+12 && player.stamina>=28) {
      act('dodge',toward()); return 0;
    }
    return stage.slam ? 0 : dist<stage.reach?-toward():0;
  }
  if(boss.phase==='recover') {
    if(player.hp<=55 && player.tonics && boss.timer>=40 && dist>stage.reach) {act('heal');return 0;}
    if(dist<=SWORD && boss.timer>=14 && player.stamina>=(stage.slam?52:24)) {act('attack');return 0;}
    return dist>SWORD-12?toward():0;
  }
  return dist>stage.reach+14?toward():0;
}
function tick() {
  if(outcome==='clear' && ai && --intermission<=0) startLevel(levelIndex+1);
  if(outcome) return;
  const stage=level();
  const steer=ai?pilot():Math.sign([...held.values()].reduce((sum,dir)=>sum+dir,0));
  if(player.timer) {
    player.timer--;
    if(player.action==='dodge') player.x+=player.roll*8.2;
    if(player.action==='attack'&&player.timer===18 && separation()<=SWORD) {
      boss.hp=Math.max(0,boss.hp-25); flash=8; sound('point');
      if(!boss.hp) finish('win');
    }
    if(player.action==='heal'&&player.timer===0) {player.hp=Math.min(100,player.hp+39);sound('point');}
  } else {
    player.x+=steer*4;
    player.stamina=Math.min(100,player.stamina+.79);
  }
  player.x=clamp(player.x,MIN,MAX);
  if(outcome) {meters();return;}
  if(flash) flash--;
  const enraged=boss.hp<=stage.hp/2;
  if(boss.phase==='approach'){
    if(separation()<=stage.reach-8) {
      boss.phase='windup'; boss.timer=enraged?stage.windup-15:stage.windup; boss.face=-toward();
    } else {
      boss.x=clamp(boss.x-toward()*(stage.speed+(enraged?1:0)),MIN,MAX);
    }
  } else if(--boss.timer===0) {
    if(boss.phase==='windup'){
      const offset=(player.x-boss.x)*boss.face;
      const dodging=player.action==='dodge'&&player.timer>0;
      const inRange=stage.slam ? Math.abs(offset)<=stage.reach : offset>=-14&&offset<=stage.reach;
      if(inRange&&!dodging) {
        player.hp=Math.max(0,player.hp-(stage.damage+(enraged?8:0)));
        if(!player.hp) finish('loss');
        else sound('miss');
      }
      boss.phase='recover'; boss.timer=stage.recovery-(enraged?14:0);
    } else boss.phase='approach';
  }
  if(!outcome) status(boss.phase==='windup'?(stage.slam?'Giant siap menghantam kedua sisi!':'Bos bersiap menyapu!'):boss.phase==='recover'?'Bos terbuka.':'Jaga jarak dan siapkan stamina.');
  meters();
}
function draw() {
  const stage=level();
  const sky=ctx.createLinearGradient(0,0,0,400);
  sky.addColorStop(0,'#261b29');sky.addColorStop(1,'#834333');
  ctx.fillStyle=sky;ctx.fillRect(0,0,800,400);
  ctx.fillStyle='#412934';
  for(let x=30;x<800;x+=153) {
    ctx.fillRect(x,85,21,260);ctx.fillRect(x+103,85,21,260);
    ctx.beginPath();ctx.arc(x+62,89,53,Math.PI,0);ctx.arc(x+62,89,32,0,Math.PI,true);ctx.fill();
  }
  ctx.fillStyle='#261b22';ctx.fillRect(0,FLOOR,800,80);
  ctx.strokeStyle='#80523d';
  for(let x=0;x<820;x+=61){ctx.beginPath();ctx.moveTo(x,FLOOR);ctx.lineTo(400+(x-400)*1.3,400);ctx.stroke();}
  if(boss.phase==='windup'&&!outcome){
    ctx.fillStyle='#fb553b55';
    ctx.fillRect(stage.slam||boss.face<0?boss.x-stage.reach:boss.x,FLOOR-16,stage.reach*(stage.slam?2:1),16);
    ctx.fillStyle='#ff946a';
    ctx.fillRect(boss.x-22,FLOOR-102,44*(boss.timer/(boss.hp<=75?26:41)),4);
  }
  fighter(player.x,player.timer&&player.action==='dodge'?28:49,'#d2c9ae','#87d6bf',toward());
  fighter(boss.x,stage.height,flash?'#ffd7a5':stage.armor,'#ff9b58',boss.phase==='windup'?boss.face:-toward());
  if(player.timer&&player.action==='attack'){
    ctx.strokeStyle='#ffdfa0';ctx.lineWidth=4;ctx.beginPath();
    ctx.arc(player.x+toward()*22,FLOOR-31,32,toward()>0?-1.2:2,toward()>0?1.1:4.25);ctx.stroke();
  }
}
function fighter(x,h,armor,glow,face) {
  ctx.fillStyle=armor;ctx.beginPath();
  ctx.moveTo(x-10,FLOOR-h);ctx.lineTo(x+10,FLOOR-h);
  ctx.lineTo(x+h*.32,FLOOR-3);ctx.lineTo(x-h*.32,FLOOR-3);ctx.fill();
  ctx.fillStyle=glow;ctx.fillRect(x+face*5-4,FLOOR-h+10,9,3);
}
const moves={ArrowLeft:-1,ArrowRight:1,KeyA:-1,KeyD:1};
const actions={KeyZ:'attack',KeyX:'dodge',KeyC:'heal'};
function manual() { if(ai) setAI(false); }
for(const [id,dir] of [['left',-1],['right',1]]){
  const button=get(id);
  button.addEventListener('pointerdown',e=>{manual();button.setPointerCapture(e.pointerId);held.set(e.pointerId,dir);});
  button.addEventListener('lostpointercapture',e=>held.delete(e.pointerId));
}
function userAct(type) {manual();act(type,Math.sign([...held.values()].reduce((s,d)=>s+d,0))); }
document.addEventListener('keydown',e=>{
  if(moves[e.code]){e.preventDefault();manual();held.set(e.code,moves[e.code]);}
  else if(actions[e.code]&&!e.repeat){e.preventDefault();userAct(actions[e.code]);}
});
document.addEventListener('keyup',e=>held.delete(e.code));
window.addEventListener('blur',()=>held.clear());
for(const name of ['attack','dodge','heal'])get(name).onclick=()=>userAct(name);
get('next').onclick=()=>{if(outcome==='clear')startLevel(levelIndex+1);canvas.focus();};
get('retry').onclick=()=>{if(outcome==='loss')startLevel(levelIndex);canvas.focus();};
get('restart').onclick=()=>{reset();canvas.focus();};
get('ai').onclick=()=>{if(ai)setAI(false);else {reset();setAI(true);}canvas.focus();};
let last,elapsed=0;
function frame(now){
  elapsed+=Math.min(65,now-(last??now));last=now;
  while(elapsed>=1000/60){tick();elapsed-=1000/60;}
  draw();requestAnimationFrame(frame);
}
reset();requestAnimationFrame(frame);
</script>
</html>
